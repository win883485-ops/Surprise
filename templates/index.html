<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise</title>

<style>
* { box-sizing: border-box; }

:root {
    --cream: #fff8f1;
    --pink: #e7a1b0;
    --rose: #a94f70;
    --green: #54775b;
}

body {
    margin: 0;
    font-family: Georgia, serif;
    background: var(--cream);
    color: #623c4b;
    overflow-x: hidden;
}

.screen {
    min-height: 100svh;
    display: none;
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 65px 24px;
}

.screen.active { display: flex; }

/* Elegant flowers made with CSS, not emojis */
.flower {
    --petal: #e9a7bb;
    width: 35px;
    height: 35px;
    position: absolute;
    display: block;
    pointer-events: none;
}

.flower .petal {
    position: absolute;
    width: 42%;
    height: 42%;
    left: 29%;
    top: 4%;
    border-radius: 70% 70% 45% 45%;
    background: var(--petal);
    transform-origin: 50% 110%;
}

.flower .petal:nth-child(2) { transform: rotate(60deg); }
.flower .petal:nth-child(3) { transform: rotate(120deg); }
.flower .petal:nth-child(4) { transform: rotate(180deg); }
.flower .petal:nth-child(5) { transform: rotate(240deg); }
.flower .petal:nth-child(6) { transform: rotate(300deg); }

.flower .center {
    position: absolute;
    width: 23%;
    height: 23%;
    border-radius: 50%;
    left: 38.5%;
    top: 38.5%;
    background: #d6ad65;
    box-shadow: 0 0 5px #fff0bd;
}

/* Flower borders stay visible on both screens */
.side-border {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 42px;
    z-index: 20;
    pointer-events: none;
    overflow: hidden;
}

.side-border.left { left: 3px; }
.side-border.right { right: 3px; }

.side-border .flower {
    width: 25px;
    height: 25px;
    left: 6px;
    animation: borderSway 4s ease-in-out infinite alternate;
}

.side-border.right .flower {
    left: 7px;
    animation-delay: -2s;
}

@keyframes borderSway {
    from { transform: rotate(-12deg) scale(.9); }
    to { transform: rotate(15deg) scale(1.08); }
}

/* INTRO */
#intro {
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(ellipse at center, #fffdf8 0%, #fff2f2 58%, #f8dfe7 100%);
}

.intro-content {
    position: relative;
    z-index: 5;
    max-width: 560px;
    padding: 30px 12px;
}

.intro-content h1 {
    font-size: clamp(36px, 8vw, 65px);
    line-height: 1.1;
    margin: 0 0 18px;
    color: #9b536c;
    font-weight: normal;
}

.intro-content p {
    font-size: 17px;
    line-height: 1.8;
    margin: 0 auto 28px;
}

.open-button {
    border: 1px solid #b86e87;
    background: #a95f79;
    color: white;
    padding: 14px 27px;
    border-radius: 30px;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 6px 18px #a95f792e;
}

.open-button:active { transform: scale(.97); }

/* Large anticlockwise flower orbits */
.orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(94vw, 760px);
    aspect-ratio: 1;
    border: 1px solid #dba9b64a;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: orbitSpin 30s linear infinite reverse;
    pointer-events: none;
}

.orbit.two {
    width: min(70vw, 530px);
    animation-duration: 22s;
}

.orbit.three {
    width: min(115vw, 920px);
    animation-duration: 42s;
}

.orbit .flower {
    width: 48px;
    height: 48px;
    left: 50%;
    top: -24px;
    margin-left: -24px;
}

.orbit.two .flower {
    width: 35px;
    height: 35px;
    top: -17px;
    margin-left: -17px;
    --petal: #dca0b5;
}

.orbit.three .flower {
    width: 30px;
    height: 30px;
    top: -15px;
    margin-left: -15px;
    --petal: #e6c18c;
}

@keyframes orbitSpin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* PHOTO GALLERY */
#gallery {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 35px;
    background:
        radial-gradient(ellipse at top, #fffdf8, #f9e8e8 85%);
    padding-top: 70px;
    padding-bottom: 70px;
}

#gallery.active { display: flex; }

.gallery-heading {
    position: relative;
    z-index: 2;
    padding: 0 20px;
}

.gallery-heading h2 {
    font-size: clamp(30px, 6vw, 48px);
    font-weight: normal;
    margin: 0 0 10px;
    color: #96536b;
}

.gallery-heading p {
    margin: 0;
    font-size: 15px;
    line-height: 1.7;
}

/* Twine */
.photo-line {
    width: min(900px, 88vw);
    height: 3px;
    background: #a88765;
    transform: rotate(-2deg);
    border-radius: 50%;
    box-shadow: 0 2px 2px #80624733;
    margin-top: 12px;
}

.photo-row {
    width: min(1000px, 88vw);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(12px, 3vw, 35px);
    margin-top: -48px;
    position: relative;
    z-index: 2;
}

.photo-card {
    width: 33.333%;
    max-width: 270px;
    position: relative;
    padding-top: 30px;
    transform: rotate(-2deg);
    transition: transform .3s ease;
    cursor: pointer;
}

.photo-card:nth-child(2) {
    transform: rotate(2deg);
    padding-top: 45px;
}

.photo-card:nth-child(3) { transform: rotate(-1deg); }

.photo-card:hover { transform: translateY(-5px) rotate(0deg); }

/* Tiny wooden peg */
.peg {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%) rotate(3deg);
    width: 15px;
    height: 36px;
    border-radius: 4px;
    background: linear-gradient(90deg, #a77b4d, #e1c29a, #9a6d43);
    border: 1px solid #96704b;
    z-index: 3;
    box-shadow: 1px 2px 3px #68472c44;
}

.photo-card img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    padding: 8px 8px 20px;
    background: #fffdf9;
    box-shadow: 0 7px 18px #68434b25;
    border: 1px solid #eadfd5;
}

.photo-card span {
    display: block;
    padding: 10px 3px 0;
    font-size: 13px;
    color: #986579;
}

/* Tap-to-enlarge viewer */
#viewer {
    position: fixed;
    inset: 0;
    background: #21161deF;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
    cursor: pointer;
}

#viewer.open { display: flex; }

#viewer img {
    max-width: 92vw;
    max-height: 85svh;
    object-fit: contain;
    background: white;
    padding: 8px;
    box-shadow: 0 10px 40px #0006;
}

.close-note {
    position: absolute;
    top: 18px;
    right: 18px;
    color: white;
    font-size: 14px;
    letter-spacing: 1px;
}

@media (max-width: 520px) {
    .side-border { width: 27px; }
    .side-border .flower {
        left: 0;
        width: 21px;
        height: 21px;
    }

    .photo-row {
        width: 91vw;
        gap: 9px;
    }

    .photo-card { padding-top: 25px; }
    .photo-card:nth-child(2) { padding-top: 38px; }
    .photo-card img { padding: 5px 5px 14px; }
    .peg { width: 12px; height: 29px; }
    .photo-card span { font-size: 11px; }
    #gallery { gap: 30px; }
}
</style>
</head>

<body>

<!-- Permanent decorative flower borders -->
<div class="side-border left" id="leftBorder"></div>
<div class="side-border right" id="rightBorder"></div>

<!-- INTRO SCREEN -->
<section class="screen active" id="intro">

    <div class="orbit">
        <span class="flower">
            <i class="petal"></i><i class="petal"></i>
            <i class="petal"></i><i class="petal"></i>
            <i class="petal"></i><i class="petal"></i>
            <i class="center"></i>
        </span>
    </div>

    <div class="orbit two">
        <span class="flower">
            <i class="petal"></i><i class="petal"></i>
            <i class="petal"></i><i class="petal"></i>
            <i class="petal"></i><i class="petal"></i>
            <i class="center"></i>
        </span>
    </div>

    <div class="orbit three">
        <span class="flower">
            <i class="petal"></i><i class="petal"></i>
            <i class="petal"></i><i class="petal"></i>
            <i class="petal"></i><i class="petal"></i>
            <i class="center"></i>
        </span>
    </div>

    <div class="intro-content">
        <h1>Hello, My Hayat</h1>
        <p>
            A little corner of the world made just for you.
            Take a breath, smile a little, and come see
            what I've kept here for you.
        </p>
        <button class="open-button" id="openGallery">
            Open your little surprise
        </button>
    </div>
</section>

<!-- PHOTO GALLERY ONLY -->
<section class="screen" id="gallery">

    <div class="gallery-heading">
        <h2>Little Moments</h2>
        <p>Some memories deserve their own little place.</p>
    </div>

    <div class="photo-line"></div>

    <div class="photo-row">
        <div class="photo-card">
            <div class="peg"></div>
            <img src="{{ url_for('static', filename='photo.jpg') }}"
                 alt="Memory one" class="gallery-photo">
            <span>A little memory</span>
        </div>

        <div class="photo-card">
            <div class="peg"></div>
            <img src="{{ url_for('static', filename='photo2.jpg') }}"
                 alt="Memory two" class="gallery-photo">
            <span>A precious moment</span>
        </div>

        <div class="photo-card">
            <div class="peg"></div>
            <img src="{{ url_for('static', filename='photo3.jpg') }}"
                 alt="Memory three" class="gallery-photo">
            <span>One to remember</span>
        </div>
    </div>
</section>

<!-- Enlarged photo viewer -->
<div id="viewer" aria-label="Enlarged photo viewer">
    <span class="close-note">TAP ANYWHERE TO CLOSE</span>
    <img id="enlargedPhoto" src="" alt="Enlarged memory">
</div>

<script>
function makeFlower(parent, top, delay) {
    const flower = document.createElement("span");
    flower.className = "flower";
    flower.style.top = top + "%";
    flower.style.animationDelay = delay + "s";

    flower.innerHTML = `
        <i class="petal"></i><i class="petal"></i>
        <i class="petal"></i><i class="petal"></i>
        <i class="petal"></i><i class="petal"></i>
        <i class="center"></i>
    `;

    parent.appendChild(flower);
}

const leftBorder = document.getElementById("leftBorder");
const rightBorder = document.getElementById("rightBorder");

for (let i = 0; i < 12; i++) {
    makeFlower(leftBorder, 3 + i * 8.5, -i * 0.3);
    makeFlower(rightBorder, 7 + i * 8.5, -i * 0.4);
}

document.getElementById("openGallery").addEventListener("click", () => {
    document.getElementById("intro").classList.remove("active");
    document.getElementById("gallery").classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
});

const viewer = document.getElementById("viewer");
const enlargedPhoto = document.getElementById("enlargedPhoto");

document.querySelectorAll(".gallery-photo").forEach(photo => {
    photo.addEventListener("click", () => {
        enlargedPhoto.src = photo.src;
        viewer.classList.add("open");
    });
});

viewer.addEventListener("click", () => {
    viewer.classList.remove("open");
    enlargedPhoto.src = "";
});
</script>

</body>
</html>
